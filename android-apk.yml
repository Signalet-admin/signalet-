name: Signalet Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Signalet_Mobile_Source.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: test -s Signalet_Mobile_Source.zip

      - name: Extract source
        run: unzip -q -o Signalet_Mobile_Source.zip -d _signalet_source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project and dependencies
        working-directory: _signalet_source/Signalet_Mobile_Source
        run: bash tool/bootstrap_platforms.sh

      - name: Format code
        working-directory: _signalet_source/Signalet_Mobile_Source
        run: dart format lib test

      - name: Fix slider verifier check
        working-directory: _signalet_source/Signalet_Mobile_Source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tool/verify_source.py")
          source = path.read_text()
          old = "'.clamp(.05, 1.0).toDouble()' in settings"
          new = "('.clamp(.05, 1.0).toDouble()' in settings or '.clamp(0.05, 1.0).toDouble()' in settings)"
          if old not in source:
              raise SystemExit("Could not find the expected slider check")
          path.write_text(source.replace(old, new))
          PY

      - name: Verify source
        working-directory: _signalet_source/Signalet_Mobile_Source
        run: python3 tool/verify_source.py

      - name: Analyze Dart code
        working-directory: _signalet_source/Signalet_Mobile_Source
        run: flutter analyze --no-pub

      - name: Run tests
        working-directory: _signalet_source/Signalet_Mobile_Source
        run: flutter test --no-pub --reporter expanded

      - name: Build Android APK
        working-directory: _signalet_source/Signalet_Mobile_Source
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signalet-android-arm64-debug-apk
          path: _signalet_source/Signalet_Mobile_Source/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
